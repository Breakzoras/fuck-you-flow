<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Right Alt</title>
<style>
/* A real ANSI keyboard, drawn rather than photographed, so the lit key is the
   key the app actually binds: the Alt immediately to the right of the spacebar.
   Photographed by press/make_key.py at 1600x900. */
:root{
  --u: 76px;              /* one key unit */
  --gap: 7px;
  --acid: #c8ff5a;
  --acid-deep: #8fd400;
  --plate: #141414;
  --cap-top: #2a2a2a;
  --cap-bot: #171717;
  --legend: #8d8d8d;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1600px;height:900px;overflow:hidden}
body{
  background:
    radial-gradient(120% 90% at 50% 118%, rgba(200,255,90,.10), transparent 58%),
    radial-gradient(90% 70% at 50% -12%, #1a1a1a, #000 62%),
    #000;
  font:600 20px/1 Consolas,"Cascadia Mono",ui-monospace,Menlo,monospace;
  display:flex;align-items:center;justify-content:center;
  -webkit-font-smoothing:antialiased;
}

.stage{perspective:2200px;perspective-origin:50% 40%}

.board{
  transform: rotateX(31deg) rotateZ(-1deg);
  transform-style:preserve-3d;
  background:linear-gradient(180deg,#1c1c1c,#0b0b0b 62%,#050505);
  border:1px solid #303030;
  border-radius:16px;
  padding:26px 24px 30px;
  box-shadow:
    0 2px 0 #3a3a3a inset,
    0 -26px 60px rgba(0,0,0,.9) inset,
    0 90px 120px rgba(0,0,0,.95),
    0 0 0 1px rgba(0,0,0,.9);
}

.row{display:flex;gap:var(--gap);margin-bottom:var(--gap)}
.row:last-child{margin-bottom:0}

.k{
  width:calc(var(--u) * var(--w, 1) + var(--gap) * (var(--w, 1) - 1));
  height:var(--u);
  border-radius:9px;
  background:linear-gradient(180deg,var(--cap-top),var(--cap-bot) 74%,#101010);
  border:1px solid #000;
  box-shadow:
    0 1px 0 rgba(255,255,255,.10) inset,
    0 -3px 5px rgba(0,0,0,.75) inset,
    0 4px 5px rgba(0,0,0,.7);
  color:var(--legend);
  display:flex;align-items:center;justify-content:center;
  padding:0 10px;
  text-align:center;
  letter-spacing:.02em;
}
.k.sm{font-size:15px}
.k.xs{font-size:13px;letter-spacing:.04em}

/* the one key the whole page is about */
.k.lit{
  background:linear-gradient(180deg,#e6ff9e,var(--acid) 46%,var(--acid-deep));
  border-color:#dcff8a;
  color:#111;
  font-weight:700;
  box-shadow:
    0 1px 0 rgba(255,255,255,.65) inset,
    0 -3px 6px rgba(90,150,0,.55) inset,
    0 0 26px rgba(200,255,90,.85),
    0 0 90px rgba(200,255,90,.45),
    0 0 170px rgba(200,255,90,.25),
    0 6px 8px rgba(0,0,0,.6);
}
/* the light it throws on the keys around it */
.k.near{
  background:linear-gradient(180deg,#38401f,#20240f 76%,#141608);
  border-color:#111;
  color:#b9c98c;
}
.k.near2{
  background:linear-gradient(180deg,#2b2e1e,#1a1c11 76%,#111208);
  color:#9aa681;
}
/* the spacebar catches the light only at the end nearest the lit key */
.k.spill{
  background:
    linear-gradient(90deg,rgba(200,255,90,0) 52%,rgba(200,255,90,.10) 84%,rgba(200,255,90,.20)),
    linear-gradient(180deg,var(--cap-top),var(--cap-bot) 74%,#101010);
  border-color:#000;
}

.caption{
  position:absolute;left:50%;bottom:64px;transform:translateX(-50%);
  text-align:center;color:#9a9a9a;font-size:22px;letter-spacing:.14em;
  text-transform:uppercase;
}
.caption b{color:var(--acid);font-weight:700}
</style>
</head>
<body>
<div class="stage">
  <div class="board">
    <!-- function row -->
    <div class="row">
      <div class="k xs" style="--w:1">Esc</div>
      <div class="k xs" style="--w:1">F1</div>
      <div class="k xs" style="--w:1">F2</div>
      <div class="k xs" style="--w:1">F3</div>
      <div class="k xs" style="--w:1">F4</div>
      <div class="k xs" style="--w:1">F5</div>
      <div class="k xs" style="--w:1">F6</div>
      <div class="k xs" style="--w:1">F7</div>
      <div class="k xs" style="--w:1">F8</div>
      <div class="k xs" style="--w:1">F9</div>
      <div class="k xs" style="--w:1">F10</div>
      <div class="k xs" style="--w:1">F11</div>
      <div class="k xs" style="--w:1">F12</div>
      <div class="k xs" style="--w:2">Del</div>
    </div>
    <!-- number row -->
    <div class="row">
      <div class="k" style="--w:1">~</div>
      <div class="k" style="--w:1">1</div>
      <div class="k" style="--w:1">2</div>
      <div class="k" style="--w:1">3</div>
      <div class="k" style="--w:1">4</div>
      <div class="k" style="--w:1">5</div>
      <div class="k" style="--w:1">6</div>
      <div class="k" style="--w:1">7</div>
      <div class="k" style="--w:1">8</div>
      <div class="k" style="--w:1">9</div>
      <div class="k" style="--w:1">0</div>
      <div class="k" style="--w:1">-</div>
      <div class="k" style="--w:1">=</div>
      <div class="k xs" style="--w:2">Backspace</div>
    </div>
    <!-- top letter row -->
    <div class="row">
      <div class="k xs" style="--w:1.5">Tab</div>
      <div class="k" style="--w:1">Q</div>
      <div class="k" style="--w:1">W</div>
      <div class="k" style="--w:1">E</div>
      <div class="k" style="--w:1">R</div>
      <div class="k" style="--w:1">T</div>
      <div class="k" style="--w:1">Y</div>
      <div class="k" style="--w:1">U</div>
      <div class="k" style="--w:1">I</div>
      <div class="k" style="--w:1">O</div>
      <div class="k" style="--w:1">P</div>
      <div class="k" style="--w:1">[</div>
      <div class="k" style="--w:1">]</div>
      <div class="k" style="--w:1.5">\</div>
    </div>
    <!-- home row -->
    <div class="row">
      <div class="k xs" style="--w:1.75">Caps</div>
      <div class="k" style="--w:1">A</div>
      <div class="k" style="--w:1">S</div>
      <div class="k" style="--w:1">D</div>
      <div class="k" style="--w:1">F</div>
      <div class="k" style="--w:1">G</div>
      <div class="k" style="--w:1">H</div>
      <div class="k" style="--w:1">J</div>
      <div class="k" style="--w:1">K</div>
      <div class="k" style="--w:1">L</div>
      <div class="k" style="--w:1">;</div>
      <div class="k" style="--w:1">'</div>
      <div class="k xs" style="--w:2.25">Enter</div>
    </div>
    <!-- bottom letter row -->
    <div class="row">
      <div class="k xs" style="--w:2.25">Shift</div>
      <div class="k" style="--w:1">Z</div>
      <div class="k" style="--w:1">X</div>
      <div class="k" style="--w:1">C</div>
      <div class="k" style="--w:1">V</div>
      <div class="k" style="--w:1">B</div>
      <div class="k" style="--w:1">N</div>
      <div class="k" style="--w:1">M</div>
      <div class="k" style="--w:1">,</div>
      <div class="k" style="--w:1">.</div>
      <div class="k" style="--w:1">/</div>
      <div class="k xs" style="--w:2.75">Shift</div>
    </div>
    <!-- the row that matters: Alt sits immediately right of the spacebar -->
    <div class="row">
      <div class="k xs" style="--w:1.25">Ctrl</div>
      <div class="k xs" style="--w:1.25">Win</div>
      <div class="k xs" style="--w:1.25">Alt</div>
      <div class="k spill" style="--w:6.25"></div>
      <div class="k lit sm" style="--w:1.25">Alt</div>
      <div class="k near xs" style="--w:1.25">Win</div>
      <div class="k near2 xs" style="--w:1.25">Menu</div>
      <div class="k xs" style="--w:1.25">Ctrl</div>
    </div>
  </div>
</div>
<div class="caption">the <b>right</b> Alt &nbsp;&middot;&nbsp; press it, speak, press it again</div>
</body>
</html>
